<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb7d5">
<title>登录 · Agent Deck</title>
<link rel="icon" href="/static/avatar.jpg" id="auth-icon">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">

<main class="auth-card">
  <img class="auth-avatar" src="/static/avatar.jpg" alt="头像" id="auth-avatar">
  <h1 class="auth-title" id="auth-title">Agent Deck</h1>
  <p class="auth-sub" id="auth-sub">先登录才能开始聊天喵</p>

  <div class="auth-tabs" role="tablist">
    <button type="button" class="auth-tab on" id="tab-login" role="tab">登录</button>
    <button type="button" class="auth-tab" id="tab-register" role="tab">用邀请码注册</button>
  </div>

  <!-- 登录：只有用户名 + 密码，完全不涉及邀请码 -->
  <form id="login-form" class="auth-form" autocomplete="on">
    <label class="auth-field">
      <span>用户名</span>
      <input id="login-name" name="username" type="text" autocomplete="username"
             minlength="3" maxlength="20" required placeholder="3~20 个字">
    </label>
    <label class="auth-field">
      <span>密码</span>
      <input id="login-password" name="password" type="password"
             autocomplete="current-password" minlength="8" required placeholder="至少 8 位">
    </label>
    <button type="submit" class="auth-submit" id="login-submit">登录</button>
  </form>

  <!-- 注册：用户名 + 密码 + 邀请码 + 图形验证码 -->
  <form id="register-form" class="auth-form" autocomplete="off" hidden>
    <label class="auth-field">
      <span>用户名</span>
      <input id="reg-name" type="text" minlength="3" maxlength="20" required
             placeholder="3~20 个字">
    </label>
    <label class="auth-field">
      <span>密码</span>
      <input id="reg-password" type="password" autocomplete="new-password"
             minlength="8" required placeholder="至少 8 位">
    </label>
    <label class="auth-field">
      <span>邀请码</span>
      <input id="reg-invite" type="text" maxlength="16" required
             placeholder="找已经在用的人要一个" id="reg-invite">
    </label>
    <label class="auth-field">
      <span>图形验证码（点图换一张）</span>
      <div class="auth-captcha">
        <input id="reg-captcha" type="text" maxlength="6" required
               autocomplete="off" placeholder="图里的 4 个字">
        <img id="captcha-img" alt="图形验证码" title="点一下换一张">
      </div>
    </label>
    <button type="submit" class="auth-submit" id="reg-submit">注册并登录</button>
  </form>

  <p class="auth-msg" id="auth-msg" hidden></p>
</main>

<script>
(function () {
  'use strict';

  const tabLoginEl = document.getElementById('tab-login');
  const tabRegisterEl = document.getElementById('tab-register');
  const loginFormEl = document.getElementById('login-form');
  const registerFormEl = document.getElementById('register-form');
  const loginSubmitEl = document.getElementById('login-submit');
  const regSubmitEl = document.getElementById('reg-submit');
  const captchaImgEl = document.getElementById('captcha-img');
  const msgEl = document.getElementById('auth-msg');

  let captchaId = '';

  /* 登录页也跟身份卡走：标题、头像、名字、欢迎语、网页图标、主题色都从 /api/persona 拿 */
  function mixColor(hex, target, ratio) {
    const value = String(hex || '').replace('#', '');
    if (value.length !== 6) return hex;
    const num = parseInt(value, 16);
    const base = [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    const to = target === 'white' ? 255 : 0;
    const out = base.map((v) => Math.round(v + (to - v) * ratio));
    return '#' + out.map((n) => n.toString(16).padStart(2, '0')).join('');
  }

  function applyPersonaBranding(info) {
    if (!info) return;
    const name = info.name || 'Agent';
    document.title = `登录 · ${name}`;
    const titleEl = document.getElementById('auth-title');
    if (titleEl) titleEl.textContent = name;
    const avatarEl = document.getElementById('auth-avatar');
    if (avatarEl && info.avatar) {
      avatarEl.src = info.avatar;
      avatarEl.alt = name;
    }
    const subEl = document.getElementById('auth-sub');
    if (subEl) subEl.textContent = `先登录才能跟${name}聊天`;
    const inviteEl = document.getElementById('reg-invite');
    if (inviteEl && info.user_name) {
      inviteEl.placeholder = `找已经在用的${info.user_name}要一个`;
    }
    if (info.icon) {
      // 和聊天页一样：删旧 link 再建新的，绕开浏览器图标缓存
      const full = info.icon + (info.icon.includes('?') ? '&' : '?') + 'v=' + Date.now();
      document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]').forEach((n) => n.remove());
      const link = document.createElement('link');
      link.rel = 'icon';
      link.href = full;
      document.head.appendChild(link);
    }
    if (/^#[0-9a-fA-F]{6}$/.test(info.theme || '')) {
      const root = document.documentElement.style;
      root.setProperty('--pink', mixColor(info.theme, 'white', 0.25));
      root.setProperty('--pink-dark', info.theme);
      root.setProperty('--pink-deep', mixColor(info.theme, 'black', 0.3));
      root.setProperty('--pink-pale', mixColor(info.theme, 'white', 0.45));
      root.setProperty('--pink-mist', mixColor(info.theme, 'white', 0.78));
      root.setProperty('--bg', mixColor(info.theme, 'white', 0.93));
      root.setProperty('--line', mixColor(info.theme, 'white', 0.7));
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = info.theme;
    }
  }

  fetch('/api/persona', { cache: 'no-store' })
    .then((resp) => (resp.ok ? resp.json() : null))
    .then((info) => { if (info) applyPersonaBranding(info); })
    .catch(() => { /* 拿不到就用内置文案，不影响登录 */ });

  function showMsg(text, ok) {
    msgEl.hidden = !text;
    msgEl.textContent = text || '';
    msgEl.classList.toggle('ok', Boolean(ok));
  }

  function setMode(register) {
    tabLoginEl.classList.toggle('on', !register);
    tabRegisterEl.classList.toggle('on', register);
    loginFormEl.hidden = register;
    registerFormEl.hidden = !register;
    showMsg('');
    if (register) {
      refreshCaptcha();
      document.getElementById('reg-name').focus();
    } else {
      document.getElementById('login-name').focus();
    }
  }

  async function refreshCaptcha() {
    try {
      const resp = await fetch('/api/auth/captcha', { cache: 'no-store' });
      if (!resp.ok) throw new Error('验证码服务忙');
      const data = await resp.json();
      captchaId = data.id;
      captchaImgEl.src = data.image;
      document.getElementById('reg-captcha').value = '';
    } catch (err) {
      captchaId = '';
      showMsg('验证码加载失败，点图重试');
    }
  }

  tabLoginEl.addEventListener('click', () => setMode(false));
  tabRegisterEl.addEventListener('click', () => setMode(true));
  captchaImgEl.addEventListener('click', refreshCaptcha);

  async function post(url, payload, button) {
    button.disabled = true;
    showMsg('');
    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      let data = null;
      try { data = await resp.json(); } catch (err) { data = null; }
      if (!resp.ok) {
        showMsg((data && data.detail) || ('失败了（' + resp.status + '）'));
        button.disabled = false;
        return false;
      }
      const next = new URLSearchParams(location.search).get('next') || '/';
      location.replace(next.startsWith('/') ? next : '/');
      return true;
    } catch (err) {
      showMsg('连不上服务器：' + (err && err.message ? err.message : err));
      button.disabled = false;
      return false;
    }
  }

  // 登录：只发用户名和密码，没有邀请码
  loginFormEl.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = document.getElementById('login-name').value.trim();
    const password = document.getElementById('login-password').value;
    if (!name || !password) {
      showMsg('用户名和密码都得填');
      return;
    }
    post('/api/auth/login', { name, password }, loginSubmitEl);
  });

  // 注册：邀请码 + 图形验证码都要
  registerFormEl.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const password = document.getElementById('reg-password').value;
    const invite = document.getElementById('reg-invite').value.trim();
    const captcha = document.getElementById('reg-captcha').value.trim();
    if (!name || !password) {
      showMsg('用户名和密码都得填');
      return;
    }
    if (!invite) {
      showMsg('要填邀请码');
      return;
    }
    if (!captcha) {
      showMsg('要填图形验证码');
      return;
    }
    post('/api/auth/register',
      { name, password, invite, captcha_id: captchaId, captcha },
      regSubmitEl).then((ok) => {
        if (!ok) refreshCaptcha();   // 验证码一次一用，失败了换一张
      });
  });

  // 已经是登录状态就直接进聊天页
  fetch('/api/auth/me', { cache: 'no-store' })
    .then((resp) => { if (resp.ok) location.replace('/'); })
    .catch(() => {});

  document.getElementById('login-name').focus();
})();
</script>
</body>
</html>
