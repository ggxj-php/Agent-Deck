[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-deck"
version = "1.0.0"
description = "可自部署的 AI Agent：身份卡换人设 + 工具开关 + 知识库检索 + 沙箱跑代码 + 网页后台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.30",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pillow>=10.0",
    "jieba>=0.42",
    "numpy>=1.24",
    "lxml>=5.0",
    "charset-normalizer>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools]
# 只声明包，不真的往下发 wheel；这么写是为了让 pip install -e . 能识别项目
py-modules = ["agent"]
packages = ["deck", "deck.kb", "deck.tools", "deck.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "workspace", "knowledge", ".cache", "sessions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
