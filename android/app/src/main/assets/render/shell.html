<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/*__HIGHLIGHT_CSS__*/
</style>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.68;
    color: #2c2733;
    overflow-wrap: anywhere;
    word-break: break-word;
    padding: 0 1px;
  }
  #root > :first-child { margin-top: 0; }
  #root > :last-child { margin-bottom: 0; }
  p { margin: 0 0 8px; }
  h1, h2, h3, h4, h5, h6 {
    margin: 14px 0 6px;
    line-height: 1.35;
    font-weight: 700;
  }
  h1 { font-size: 19px; }
  h2 { font-size: 17.5px; }
  h3 { font-size: 16px; }
  h4, h5, h6 { font-size: 15px; }
  ul, ol { margin: 4px 0 8px; padding-left: 1.35em; }
  li { margin: 2px 0; }
  li > p { margin: 0; }
  a { color: #d94f92; text-decoration: none; border-bottom: 1px solid rgba(217, 79, 146, .35); }
  strong { color: #1f1a24; }
  hr { border: 0; border-top: 1px solid #f0dde6; margin: 12px 0; }
  blockquote {
    margin: 8px 0;
    padding: 2px 0 2px 10px;
    border-left: 3px solid #ffd0e2;
    color: #6b6270;
  }
  code {
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: .89em;
    background: rgba(255, 145, 190, .16);
    color: #a5336d;
    padding: 1px 4px;
    border-radius: 4px;
  }
  pre {
    margin: 8px 0;
    padding: 10px 12px;
    background: #23252f;
    border-radius: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  pre code {
    background: transparent;
    color: #e8e8ee;
    padding: 0;
    font-size: 12.5px;
    line-height: 1.55;
    display: block;
    white-space: pre;
  }
  table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
    display: block;
    overflow-x: auto;
  }
  th, td {
    border: 1px solid #f0dfe7;
    padding: 4px 8px;
    text-align: left;
  }
  th { background: #fff0f6; font-weight: 600; }
  img { max-width: 100%; height: auto; border-radius: 8px; vertical-align: middle; }
  img.sticker {
    max-width: 132px;
    max-height: 132px;
    display: block;
    margin: 6px 0;
  }
  .hljs { background: transparent !important; }
  ::selection { background: rgba(255, 154, 196, .35); }
</style>
</head>
<body>
<div id="root"></div>
<script>/*__MARKED_JS__*/</script>
<script>/*__PURIFY_JS__*/</script>
<script>/*__HIGHLIGHT_JS__*/</script>
<script>/*__RENDERER_JS__*/</script>
</body>
</html>
