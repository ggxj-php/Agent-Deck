<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb7d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>永雏塔菲 · Agent</title>
<link rel="icon" href="/static/avatar.jpg">
<link rel="stylesheet" href="/static/vendor/highlight.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="side-head">
    <img class="side-avatar" src="/static/avatar.jpg" alt="">
    <div class="side-who">
      <div class="side-name" id="side-name">…</div>
      <button type="button" class="side-invite" id="side-invite" title="点一下复制邀请码">
        邀请码 <code id="side-invite-code">…</code>
      </button>
    </div>
  </div>
  <button type="button" class="side-new" id="side-new">＋ 新会话</button>
  <a class="side-admin" id="side-admin" href="/admin" hidden>⚙ 管理员后台</a>
  <div class="side-list" id="side-list"></div>
  <div class="side-foot">
    <button type="button" class="side-link" id="side-pass">改密码</button>
    <button type="button" class="side-link" id="side-logout">退出登录</button>
  </div>
</aside>
<div class="side-scrim" id="side-scrim" hidden></div>
<button type="button" class="side-toggle" id="side-toggle" aria-label="会话列表">☰</button>

<header class="topbar">
  <img class="avatar" src="/static/avatar.jpg" alt="塔菲">
  <button type="button" class="who who-btn" id="user-open" title="用户中心（改密码 / 退出登录）">
    <div class="name">永雏塔菲</div>
    <div class="status" id="status">在线喵</div>
  </button>
  <button type="button" id="think-toggle" class="think-toggle on" role="switch"
          aria-checked="true" aria-label="深度思考"
          title="深度思考：开（点一下关掉，回答更快）">
    <span class="think-toggle-text">思考</span>
    <span class="think-toggle-track"><span class="think-toggle-knob"></span></span>
  </button>
  <button type="button" id="new-chat" class="new-chat">新会话</button>
</header>

<main id="messages" class="messages"></main>

<button type="button" id="to-bottom" class="to-bottom" aria-label="回到最底部">
  <span aria-hidden="true">↓</span>
</button>

<div class="ctx-bar" id="ctx-bar" hidden>
  <span class="ctx-label">上下文</span>
  <span class="ctx-track"><span class="ctx-fill" id="ctx-fill"></span></span>
  <span class="ctx-text" id="ctx-text">0%</span>
</div>

<form id="composer" class="composer">
  <div class="attach-bar" id="attach-bar" hidden></div>
  <div class="composer-row">
    <button type="button" id="pick-image" class="icon-btn" aria-label="发送图片" title="发送图片">🖼</button>
    <textarea id="input" rows="1" placeholder="和塔菲说点什么喵…" autocomplete="off"></textarea>
    <button id="send" type="submit" aria-label="发送">发送</button>
  </div>
  <input type="file" id="image-input" accept="image/*" multiple hidden>
</form>

<div class="modal" id="leave-modal" hidden>
  <div class="modal-box">
    <h3>这就走啦喵？</h3>
    <p class="modal-hint">
      这段对话还在这个页面上，走了就看不到了。<br>
      想接着聊就点「再待会儿」，确实要走再点「离开」。
    </p>
    <div class="modal-btns">
      <button type="button" id="leave-cancel" class="modal-cancel">再待会儿</button>
      <button type="button" id="leave-ok">离开</button>
    </div>
  </div>
</div>

<div class="modal" id="user-modal" hidden>
  <div class="modal-box user-box">
    <button type="button" class="user-close" id="user-close" aria-label="关闭">×</button>

    <div class="user-head">
      <img class="user-avatar" src="/static/avatar.jpg" alt="塔菲">
      <div class="user-head-text">
        <div class="user-title" id="user-title">…</div>
        <div class="user-sub" id="user-sub">用户中心</div>
      </div>
    </div>

    <div class="user-rows">
      <div class="user-row">
        <span>我的邀请码</span>
        <button type="button" class="user-invite" id="user-invite" title="点一下复制">…</button>
      </div>
      <div class="user-row"><span>注册时间</span><b id="user-created">—</b></div>
      <div class="user-row"><span>我的会话</span><b id="user-sessions">—</b></div>
    </div>

    <h4 class="user-h4">改密码</h4>
    <form id="pass-form">
      <label class="pass-field"><span>原密码</span>
        <input type="password" id="pass-old" autocomplete="current-password" required></label>
      <label class="pass-field"><span>新密码</span>
        <input type="password" id="pass-new" autocomplete="new-password"
               minlength="8" required placeholder="至少 8 位"></label>
      <label class="pass-field"><span>确认新密码</span>
        <input type="password" id="pass-confirm" autocomplete="new-password"
               minlength="8" required></label>
      <p class="modal-hint" id="pass-msg" hidden></p>
      <div class="modal-actions">
        <button type="submit" id="pass-ok">保存新密码</button>
      </div>
    </form>

    <button type="button" class="user-logout" id="user-logout">退出登录</button>
  </div>
</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
